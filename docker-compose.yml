# Single-machine deployment (e.g. an Oracle Cloud Always Free VM, or any VPS). The database
# itself lives on Neon (external, not on this machine) — see DEPLOYMENT.md. Run from the repo
# root:
#   cp .env.docker.example .env
#   # edit .env with real secrets, your Neon connection string, and your domain
#   docker compose up -d --build
#
# A reverse proxy (Nginx, see deploy/nginx.sbm-nac.conf.example) is expected to sit in front
# of this on the host and terminate TLS; these two services are not exposed with HTTPS
# themselves.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: ${CORS_ORIGIN}
      METRIC_SAMPLE_INTERVAL_MS: 2000
      LOG_LEVEL: info
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      NAC_AGENT_SECRET: ${NAC_AGENT_SECRET}
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    restart: unless-stopped
    environment:
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
